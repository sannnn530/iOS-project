name: LeviLauncher
options:
  bundleIdPrefix: com.sannnn530
  deploymentTarget:
    iOS: "15.0"
targets:
  LeviLauncher:
    type: application
    platform: iOS
    sources:
      - LeviLauncher
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sannnn530.levilauncher
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        CODE_SIGNING_ALLOWED: NO
